name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      # Report every Python version instead of cancelling the rest on the first failure
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # The pip cache key needs a dependency file; this repo has setup.py,
          # not requirements.txt/pyproject.toml
          cache-dependency-path: setup.py

      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Import check (fresh install must import cleanly)
        run: python -c "import aethelnet; print(aethelnet.__all__)"

      - name: Run tests
        run: pytest -q
