name: secret-scan

on:
  push:
  pull_request:

jobs:
  hardcoded-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails if a 64-hex-character string (the shape of an Ethereum private key)
      # appears in tracked source or config files. Notebooks are excluded because
      # their embedded outputs are not code. Same check as aethelnet-node/contracts.
      - name: No hard-coded private keys
        run: |
          matches=$(git grep -nIE '(0x)?[0-9a-fA-F]{64}' -- ':!*.ipynb' || true)
          if [ -n "$matches" ]; then
            echo "::error::Possible hard-coded private key. Read it from the environment (.env) instead."
            echo "$matches" | sed -E 's/[0-9a-fA-F]{64}/<REDACTED>/g'
            exit 1
          fi
          echo "No hard-coded keys found."
